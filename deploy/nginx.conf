# nginx site config for trendingdata.in
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/trendingdata.in
#          sudo ln -s /etc/nginx/sites-available/trendingdata.in /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then get HTTPS: sudo certbot --nginx -d trendingdata.in -d www.trendingdata.in
# (certbot rewrites this file to add the TLS block and the :80 -> :443 redirect)

server {
    listen 80;
    listen [::]:80;
    server_name trendingdata.in www.trendingdata.in;

    # Node serves both the SPA and the API on one origin.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-Sent Events: no buffering, no timeout, or the live feed dies.
    location /api/orders/stream {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    client_max_body_size 4m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
